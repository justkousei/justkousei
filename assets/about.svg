<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="ABOUT">
<defs>
<linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="432" y2="0"><stop offset="0" class="ln0" stop-opacity="0"/><stop offset="1" class="ln1" stop-opacity=".9"/></linearGradient>
<linearGradient id="gr" gradientUnits="userSpaceOnUse" x1="568" y1="0" x2="940" y2="0"><stop offset="0" class="ln1" stop-opacity=".9"/><stop offset="1" class="ln0" stop-opacity="0"/></linearGradient>
</defs>
<style>
.ln0{stop-color:#7C3AED}.ln1{stop-color:#2563EB}
