<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" width="280" height="56" role="img" aria-label="INSTAGRAM @justkousei">
<defs><linearGradient id="cs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="cs0"/><stop offset="1" class="cs1"/></linearGradient></defs>
<style>
