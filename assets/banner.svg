<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="justkousei, Juan Gallego">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="bg0"/><stop offset="1" class="bg1"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="ink0"/><stop offset="1" class="ink1"/></linearGradient>
<linearGradient id="hr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="hr0" stop-opacity="0"/><stop offset=".5" class="hr0"/><stop offset=".5" class="hr1"/><stop offset="1" class="hr1" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
<clipPath id="clip"><rect width="1000" height="340" rx="22"/></clipPath>
</defs>
<style>
.bg0{stop-color:#F5F3FF}.bg1{stop-color:#DBEAFE}
.ink0{stop-color:#5B21B6}.ink1{stop-color:#1D4ED8}
.hr0{stop-color:#7C3AED}.hr1{stop-color:#2563EB}
.orbA{fill:#8B5CF6;opacity:.38}.orbB{fill:#2563EB;opacity:.30}
.star{fill:#4C1D95}.frame{stroke:#6D28D9}
.sub{fill:#4338CA}.phrase{fill:#312E81}
.sl{stroke:#4C1D95}
@media (prefers-color-scheme: dark){
.bg0{stop-color:#07071A}.bg1{stop-color:#15123F}
.ink0{stop-color:#C4B5FD}.ink1{stop-color:#60A5FA}
.hr0{stop-color:#8B5CF6}.hr1{stop-color:#3B82F6}
.orbA{opacity:.50}.orbB{opacity:.42}
.star{fill:#E0E7FF}.frame{stroke:#8B5CF6}
.sub{fill:#A5B4FC}.phrase{fill:#C7D2FE}
.sl{stroke:#E0E7FF}}
.tw{animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
.o1{animation:d1 18s ease-in-out infinite}
.o2{animation:d2 22s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,40px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-130px,-30px)}}
.sl{fill:none;stroke-width:1.4;stroke-linecap:round;opacity:0;animation:sh 11s linear infinite}
@keyframes sh{0%{transform:translate(0,0);opacity:0}1.5%{opacity:.9}9%{transform:translate(240px,120px);opacity:0}100%{transform:translate(240px,120px);opacity:0}}
.ph{opacity:0;animation:ph 15s ease-in-out infinite}
@keyframes ph{0%{opacity:0}4%{opacity:1}30%{opacity:1}34%{opacity:0}100%{opacity:0}}
.pulse{animation:pu 4s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
</style>
